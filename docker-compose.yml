# =============================================================================
# Talentro: полный стенд одним `docker compose up -d` — Postgres, Go-API,
# витрина Next.js и Caddy с HTTPS.
#
#   cp .env.example .env          # и заполнить (см. docs/deploy.md §3)
#   docker compose config -q      # проверить синтаксис и подхват .env
#   docker compose build          # на первом запуске
#   docker compose up -d          # поднять
#   docker compose ps             # все четыре сервиса должны быть healthy
#
# Наружу смотрят только 80 и 443 (Caddy). База и API живут во внутренней сети:
# с VDS они в интернет не публикуются.
#
# Сервис web собирается из ./web. В этой ветке каталога web нет (worktree
# ограничена sparse-checkout на backend/database/docs/infra), поэтому файл
# web/Dockerfile должен приехать из web-ветки — точное содержимое в
# docs/deploy.md §4. Пока его нет, `docker compose build web` упадёт с
# «Dockerfile not found», а остальные три сервиса поднимаются:
#   docker compose up -d db api caddy
# =============================================================================

name: talentro

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # `:?` — compose откажется стартовать с внятным сообщением, если переменную
      # забыли в .env. Лучше этот провал, чем база с паролем по умолчанию.
      POSTGRES_USER: ${POSTGRES_USER:?не задан POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?не задан POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?не задан POSTGRES_DB}
      # Кластер перенимает TZ при первой инициализации (на пустом томе). Если том
      # уже создан — менять отдельно: command: postgres -c timezone=...
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Инициализация только на ПУСТОМ pgdata: переподнять схему на живой базе этим
      # томом нельзя — это отдельный шаг, §5 в docs/deploy.md. В каталоге
      # database/ лежит ещё checks.sql, и точка входа Postgres обходит файлы
      # алфавитно с ON_ERROR_STOP:
      # проверки целостности на пустой базе уронили бы инициализацию. Поэтому
      # монтируем ровно один файл и с префиксом 01_.
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      # $$ — экранирование: переменную должен подставить шелл внутри контейнера, а
      # не compose на старте.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    # ports тут нарочно нет: api ходит к db по имени сервиса. Для psql с хоста —
    # docker compose exec -it db psql -U <POSTGRES_USER> -d <POSTGRES_DB>.

  api:
    build:
      context: ./backend/Talentro
      args:
        # Тег релиза попадает в /health (§9.1) через -ldflags в Dockerfile.
        VERSION: ${APP_VERSION:-dev}
    image: talentro-api:${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8080
      # Хост db вместо localhost: контейнеры смотрят в свою сеть. sslmode=disable
      # оправдан только внутри этой сети.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      # Хранить и требовать нечего: конфигурация не читает MODERATOR_TOKEN — доступ
      # в кабинет модерации решают кука сессии и users.account_type, а не отдельный
      # токен, который пришлось бы тащить в клиентские сборки.
      # HMAC-ключ куки talentro_session (§12.1). Без него api не стартует —
      # вход без подписи это вход, который любой посетитель соберёт сам.
      # Длинная случайная строка; менять нельзя, иначе всех разлогинит.
      SESSION_SECRET: ${SESSION_SECRET:?не задан SESSION_SECRET}
      # POST /api/auth/tester. Пусто — тестовый вход отключён (сервер отвечает
      # 503), а не открыт всем: токен проверяющего не должен жить в репозитории.
      TESTER_TOKEN: ${TESTER_TOKEN:-}
      # Web-клиент Google OAuth 2.0 (тот же NEXT_PUBLIC_GOOGLE_CLIENT_ID, что в
      # web/.env). Пусто — POST /api/auth/google отвечает 503.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Пустое значение = междоменным запросам отказано. При одном домене и Caddy
      # браузер идёт в /api/* с того же origin, поэтому список не нужен; он
      # пригодится, если витрина уедет на поддомен.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Куда обработчик медиа пишет загрузки и откуда раздаёт их сам. Значение
      # задано здесь, а не в .env: путь внутри контейнера обязан совпадать с
      # `root * /srv/media` в infra/Caddyfile, иначе один и тот же путь из БД
      # (/media/cards/…) у раздачи и у записи означал бы разные файлы. Умолчание
      # конфига (./media) в образе не годится: WORKDIR /app принадлежит root, а
      # процесс — uid 10001, и создать /app/media он не сможет.
      MEDIA_DIR: /srv/media
      TZ: ${TZ:-Europe/Chisinau}
    volumes:
      # Тот же каталог хоста, что у caddy, но на запись: POST /api/v1/me/activities/
      # {id}/photos|videos кладёт файл на диск, DELETE …/media/{mediaID} снимает его.
      # Без этого тома загрузки жили бы в слое контейнера и исчезают при пересборке.
      #
      # Владельцем каталога на хосте обязан быть uid 10001:10001 — это USER из
      # backend/Talentro/Dockerfile. Самая частая поломка стенда именно здесь:
      # root-овый /srv/media читается (фото 200), но каждая загрузка отвечает 500
      # «не удалось сохранить файл в хранилище медиа». Лечение до старта:
      #   sudo mkdir -p /srv/media && sudo chown -R 10001:10001 /srv/media
      # infra/setup-server.sh создаёт каталог, но отдаёт его пользователю deploy —
      # для записи этого недостаточно. Порядок и проверка — docs/deploy.md §8.
      - ${MEDIA_HOST_DIR:-/srv/media}:/srv/media
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    # Процесс слушает 8080 от имени uid 10001 и пишет только в примонтированный том
    # медиа — больше ему писать некуда. Запись в том не требует прав ядра: доступ
    # решает владелец каталога на хосте, а не capabilities, поэтому cap_drop остаётся
    # полным и загрузка файлов его не ослабляет.
    cap_drop:
      - ALL

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* встраиваются в клиентский бандл на этапе build, поэтому
        # меняются только пересборкой образа (docs/deploy.md §4.1).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?не задан NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    image: talentro-web:${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      # service_started, не service_healthy: без базы витрина должна показывать
      # страницу с ошибкой, а не простаивать в ожидании здорового API.
      api:
        condition: service_started
    environment:
      # next start читает PORT (default 3000) — фиксируем явно, чтобы Caddy и
      # healthcheck знали один и тот же порт.
      PORT: 3000
      # Серверный рендер читает переменные в рантайме, поэтому им нужен тот же
      # адрес, что и в args: SSR ходит в публичный origin через Caddy.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      TZ: ${TZ:-Europe/Chisinau}
    healthcheck:
      # /sw.js — статика из web/public: отвечает быстро и, в отличие от /.
      # (главная тянет каталог через API), не зависит от состояния базы.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/sw.js').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3: Caddy объявляет Alt-Svc, а без UDP-443 браузер просто не получит
      # третью версию. Не обязательно, но дёшево.
      - "443:443/udp"
    environment:
      # Домен, на который указывает A-запись; сертификат Caddy получит сам.
      DOMAIN: ${DOMAIN:?не задан DOMAIN}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Заглушка «скоро» из прошлой стадии — остаётся на месте, пока витрина не
      # поднялась (использование описано в docs/deploy.md §2).
      - ./infra/landing-stub:/usr/share/caddy:ro
      # Раздачу /media/* берёт на себя Caddy: file_server умеет Range (видео
      # перематывается) и не занимает воркер Go статикой. Тому здесь достаточно
      # чтения — пишет в него api своим монтированием того же каталога хоста, а
      # Caddy только отдаёт. Один MEDIA_HOST_DIR на оба сервиса обязателен: пути
      # в БД начинаются с /media/ (§7.14) и должны означать одни и те же файлы.
      - ${MEDIA_HOST_DIR:-/srv/media}:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
